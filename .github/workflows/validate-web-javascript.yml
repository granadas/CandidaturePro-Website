name: Validate web JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - '.github/workflows/validate-web-javascript.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - '.github/workflows/validate-web-javascript.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          find app -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Check session and search regressions
        run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate job refresh Edge Function TypeScript
        run: deno check supabase/functions/job-market-refresh/index.ts
