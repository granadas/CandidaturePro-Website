name: Validate web JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/validate-web-javascript.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/validate-web-javascript.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          find app -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
